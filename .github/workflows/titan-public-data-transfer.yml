name: Titan public-source transfer

on:
  push:
    branches: [titan-public-data-transfer]
    paths:
      - '.github/workflows/titan-public-data-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Corlies Titan topography package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          curl -L --fail --retry 5 --retry-delay 2 \
            -o sources/titan_topo_corlies.zip \
            https://data.astro.cornell.edu/titan_topo_corlies/titan_topo_corlies.zip
          ls -lh sources/titan_topo_corlies.zip
          sha256sum sources/titan_topo_corlies.zip | tee sources/SHA256SUMS.txt
          unzip -t sources/titan_topo_corlies.zip
      - name: Upload Corlies source artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-corlies-source
          path: sources/
          compression-level: 0
          retention-days: 1
