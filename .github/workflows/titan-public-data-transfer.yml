name: Titan public-source transfer

on:
  push:
    branches: [titan-public-data-transfer]
    paths:
      - '.github/workflows/titan-public-data-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download and validate GTDR archive bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gtdr
          curl -L --fail --retry 5 --retry-delay 2 \
            -o gtdr/gtdr-data.zip \
            https://asc-astropedia.s3.us-west-2.amazonaws.com/Titan/Cassini/GTDR/gtdr-data.zip
          test "$(stat -c%s gtdr/gtdr-data.zip)" = "268687930"
          unzip -t gtdr/gtdr-data.zip
          unzip -Z1 gtdr/gtdr-data.zip > gtdr/files.txt
          sha256sum gtdr/gtdr-data.zip | tee gtdr/SHA256SUMS.txt
          ls -lh gtdr/gtdr-data.zip

      - name: Upload raw GTDR source artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-gtdr-source
          path: gtdr/
          compression-level: 0
          retention-days: 1
